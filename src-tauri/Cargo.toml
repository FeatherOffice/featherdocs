[package]
name = "featherdocs"
version = "0.1.0"
description = "FeatherDocs — editor de documentos da suíte FeatherOffice"
authors = ["FeatherDocs"]
edition = "2021"
rust-version = "1.77.2"

# Casca fina: janela, protocolo da ponte, caixas de abrir/salvar e o disco. Todo o
# documento, a paginação e os formatos estão nos crates `featherdocs-*`.
[lib]
name = "featherdocs_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Caminho, não workspace: o `target/` do Tauri não recompila por causa do motor.
featherdocs-ponte = { path = "../crates/featherdocs-ponte" }
# O histórico de versões dentro do .fdoz (Git embutido, `gix`): só no aplicativo, não vai para o .wasm.
featherdocs-historico = { path = "../crates/featherdocs-historico" }

# A caixa de abrir/salvar pelo portal do sistema (xdg-desktop-portal) no Linux;
# nos outros sistemas, a caixa nativa (como no FeatherSheet e no FeatherCAD).
[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-dialog = { version = "2", default-features = false, features = ["xdg-portal"] }
# O mesmo WebKitGTK que o Tauri já usa: só para pedir aceleração por GPU (`HardwareAccelerationPolicy`).
webkit2gtk = { version = "2.0.2", features = ["v2_16"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-dialog = { version = "2" }

# O `app:dev` compila em debug, e o motor em debug é ~7x mais lento (medido no FeatherCAD). Só o
# motor e o que ele usa ficam otimizados; a casca da janela segue em debug e compila rápido.
[profile.dev.package.featherdocs-core]
opt-level = 3
[profile.dev.package.featherdocs-ponte]
opt-level = 3
[profile.dev.package.featherdocs-io]
opt-level = 3
[profile.dev.package.pulldown-cmark]
opt-level = 3
[profile.dev.package.quick-xml]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.zip]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[lints.clippy]
too_many_lines = "deny"
cognitive_complexity = "deny"

